name: CI

on:
  push:
    branches:
      - main
  merge_group:
  pull_request:
    types:
      - opened
      - synchronize

env:
  BAZEL_STARTUP_FLAGS: --bazelrc=${{ github.workspace }}/.github/github.bazelrc
  # Read-only BuildBuddy key for runs that cannot see secrets (pull requests
  # from forks, Dependabot). Set the BUILDBUDDY_READONLY_API_KEY repository
  # variable to a key created with "Read-only key" checked, or replace the
  # expression with the key itself. See .github/actions/buildbuddy.
  BUILDBUDDY_READONLY_API_KEY: ${{ vars.BUILDBUDDY_READONLY_API_KEY }}

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: ubuntu-24.04
          - os: ubuntu-24.04-arm
          - os: windows-2022
    steps:
      # Checkout the code
      - uses: actions/checkout@v4

      - uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - uses: ./.github/actions/buildbuddy
        with:
          api_key: ${{ secrets.BUILDBUDDY_API_KEY }}
          readonly_api_key: ${{ env.BUILDBUDDY_READONLY_API_KEY }}
          user: "${{ github.job }} (${{ matrix.os }})"

      - name: Setup Bazelrc (Windows)
        run: |
          echo "TEMP=$env:RUNNER_TEMP" >> "$env:GITHUB_ENV"
          echo "TMP=$env:RUNNER_TEMP" >> "$env:GITHUB_ENV"
          echo "startup --output_user_root=D:/bzl" > ./user.bazelrc
        if: startswith(runner.os, 'Windows')
      - name: Setup Bazelrc
        run: |
          echo "common --keep_going" >> ./user.bazelrc

      # Build and Test the code
      - name: Test (Unix)
        run: bazel ${BAZEL_STARTUP_FLAGS[@]} test //...
        if: startswith(runner.os, 'Windows') != true
      - name: Test (Windows)
        run: bazel $env:BAZEL_STARTUP_FLAGS test //...
        if: startswith(runner.os, 'Windows')

      - name: Coverage (Unix)
        run: |
          bazel ${BAZEL_STARTUP_FLAGS[@]} coverage //tests/simple_test:test_assertions
          grep -q 'SF:.*\.adb' bazel-out/_coverage/_coverage_report.dat
        if: startswith(runner.os, 'Windows') != true

  ci-examples:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        example:
          - simple
          - ghdl
        os:
          - macos-latest
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - windows-2022
    steps:
      # Checkout the code
      - uses: actions/checkout@v4

      - uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ matrix.example }}
          repository-cache: true

      - uses: ./.github/actions/buildbuddy
        with:
          api_key: ${{ secrets.BUILDBUDDY_API_KEY }}
          readonly_api_key: ${{ env.BUILDBUDDY_READONLY_API_KEY }}
          user: "${{ github.job }} (${{ matrix.example }}, ${{ matrix.os }})"

      - name: Setup Bazelrc (Windows)
        working-directory: "${{ github.workspace }}/examples/${{ matrix.example }}"
        run: |
          echo "TEMP=$env:RUNNER_TEMP" >> "$env:GITHUB_ENV"
          echo "TMP=$env:RUNNER_TEMP" >> "$env:GITHUB_ENV"
          echo "startup --output_user_root=D:/bzl" > ./user.bazelrc
        if: startswith(runner.os, 'Windows')
      - name: Setup Bazelrc
        working-directory: "${{ github.workspace }}/examples/${{ matrix.example }}"
        run: |
          echo "common --keep_going" >> ./user.bazelrc

      # Build and Test the code
      - name: Test (Unix)
        working-directory: "${{ github.workspace }}/examples/${{ matrix.example }}"
        run: bazel ${BAZEL_STARTUP_FLAGS[@]} test //...
        if: startswith(runner.os, 'Windows') != true
      - name: Test (Windows)
        working-directory: "${{ github.workspace }}/examples/${{ matrix.example }}"
        run: bazel $env:BAZEL_STARTUP_FLAGS test //...
        if: startswith(runner.os, 'Windows')

  ci-format:
    runs-on: ubuntu-24.04
    steps:
      # Checkout the code
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Buildifier
        run: |
          wget "https://github.com/bazelbuild/buildtools/releases/download/v${BUILDIFIER_VERSION}/buildifier-linux-amd64" -O buildifier
          chmod +x ./buildifier
          ./buildifier -lint=warn -mode=check -warnings=all -r ${{ github.workspace }}
          rm ./buildifier
        env:
          BUILDIFIER_VERSION: 8.2.0
      - uses: DoozyX/clang-format-lint-action@v0.14
        with:
          source: "."
          extensions: "h,c,cc"
          clangFormatVersion: 14
